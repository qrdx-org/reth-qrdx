[package]
name = "qrdx-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
reth-cli-util.workspace = true
reth-qrdx-cli.workspace = true
reth-qrdx-node.workspace = true
reth-qrdx-chainspec.workspace = true

[lints]
workspace = true

[features]
default = ["jemalloc"]
jemalloc = ["reth-cli-util/jemalloc", "reth-qrdx-cli/jemalloc"]
jemalloc-prof = ["reth-cli-util/jemalloc-prof"]
tracy-allocator = ["reth-cli-util/tracy-allocator"]
asm-keccak = ["reth-qrdx-cli/asm-keccak"]
dev = ["reth-qrdx-cli/dev"]

min-error-logs = []
min-warn-logs = []
min-info-logs = []
min-debug-logs = []
min-trace-logs = []

[[bin]]
name = "qrdx-reth"
path = "src/main.rs"
